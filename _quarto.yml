project:
  type: book
  output-dir: _book

book:
  title: "Music Theory Through Sonic Pi"
  subtitle: "For programmers who cannot read a note"
  author: "Gauden Galea"
  date: last-modified
  date-format: "D MMMM YYYY"
  favicon: assets/img/favicon.png
  site-url: https://gauden.github.io/coding-harmony/
  repo-url: https://github.com/gauden/coding-harmony
  repo-branch: main
  repo-actions: [edit, issue]
  search: true
  sidebar:
    style: docked
    collapse-level: 1
  page-footer:
    left: "Code MIT, text CC BY-NC-SA 4.0. Copyright 2026 Gauden Galea."
    right:
      - text: "Licence"
        href: https://github.com/gauden/coding-harmony/blob/main/LICENSE.md

  # Chapters are generated from curriculum/music_theory_through_sonic_pi.html.
  # Run scripts/gen_book.py after changing the syllabus. Everything outside the
  # markers is handwritten and safe to edit.
  chapters:
    # BEGIN CHAPTERS (generated by scripts/gen_book.py, do not edit by hand)
    - index.qmd
    - setup.qmd
    - part: "Part 0. Getting a sound out"
      chapters:
        - parts/00-getting-a-sound-out/01-hello-sound.qmd
        - parts/00-getting-a-sound-out/02-notes-are-integers.qmd
        - parts/00-getting-a-sound-out/03-time-beats-seconds.qmd
    - part: "Part 1. Why sound has structure"
      chapters:
        - parts/01-why-sound-has-structure/04-one-note-many-notes.qmd
        - parts/01-why-sound-has-structure/05-consonance-small-whole-numbers.qmd
        - parts/01-why-sound-has-structure/06-twelve-notes-one-compromise.qmd
        - parts/01-why-sound-has-structure/07-envelope-instrument.qmd
    - part: "Part 2. Pitch space"
      chapters:
        - parts/02-pitch-space/08-twelve-pitch-classes.qmd
        - parts/02-pitch-space/09-octaves-address-space.qmd
        - parts/02-pitch-space/10-sharps-flats-why-spelling-sound.qmd
        - parts/02-pitch-space/11-pentatonic-scale-with-no-wrong-notes.qmd
    - part: "Part 3. Rhythm and meter"
      chapters:
        - parts/03-rhythm-and-meter/12-durations-fractions.qmd
        - parts/03-rhythm-and-meter/13-bars-accent-that-makes-meter-audible.qmd
        - parts/03-rhythm-and-meter/14-rests-dots-ties.qmd
        - parts/03-rhythm-and-meter/15-syncopation-grid.qmd
        - parts/03-rhythm-and-meter/16-swing-microtiming.qmd
        - parts/03-rhythm-and-meter/17-tuplets-3-against-2.qmd
    - part: "Part 4. Intervals"
      chapters:
        - parts/04-intervals/18-interval-carries-two-measurements.qmd
        - parts/04-intervals/19-interval-sound-dictionary.qmd
        - parts/04-intervals/20-build-your-own-drill-harness.qmd
    - part: "Part 5. Scales and keys"
      chapters:
        - parts/05-scales-and-keys/21-major-scale-step-formula.qmd
        - parts/05-scales-and-keys/22-scale-degrees-pull-toward-home.qmd
        - parts/05-scales-and-keys/23-minor-family.qmd
        - parts/05-scales-and-keys/24-modes-over-drone.qmd
        - parts/05-scales-and-keys/25-circle-fifths-data-structure.qmd
    - part: "Part 6. Chords and harmony"
      chapters:
        - parts/06-chords-and-harmony/26-triads-stacked-thirds.qmd
        - parts/06-chords-and-harmony/27-inversions-voicing.qmd
        - parts/06-chords-and-harmony/28-diatonic-chords-roman-numerals.qmd
        - parts/06-chords-and-harmony/29-cadences-are-punctuation.qmd
        - parts/06-chords-and-harmony/30-seventh-chords-tension.qmd
        - parts/06-chords-and-harmony/31-voice-leading-optimisation-problem.qmd
    - part: "Part 7. Melody, phrase, and form"
      chapters:
        - parts/07-melody-phrase-and-form/32-contour-rhythm-are-separable.qmd
        - parts/07-melody-phrase-and-form/33-motive-sequence-development.qmd
        - parts/07-melody-phrase-and-form/34-question-answer.qmd
        - parts/07-melody-phrase-and-form/35-chord-tones-decoration.qmd
        - parts/07-melody-phrase-and-form/36-notated-versus-played.qmd
        - parts/07-melody-phrase-and-form/37-form-control-flow.qmd
    - part: "Part 8. Reading notation"
      chapters:
        - parts/08-reading-notation/38-treble-clef-coordinate-system.qmd
        - parts/08-reading-notation/39-bass-clef-grand-staff.qmd
        - parts/08-reading-notation/40-key-signatures-defaults.qmd
        - parts/08-reading-notation/41-decode-four-printed-bars.qmd
    - part: "Part 9. Transcription"
      chapters:
        - parts/09-transcription/42-finding-music-you-can-legally-use.qmd
        - parts/09-transcription/43-four-pass-pipeline.qmd
        - parts/09-transcription/44-transcribe-by-ear.qmd
        - parts/09-transcription/45-transcribe-from-score.qmd
        - parts/09-transcription/46-debug-transcription-like-software.qmd
    - part: "Part 10. Texture and arrangement"
      chapters:
        - parts/10-texture-and-arrangement/47-independent-voices.qmd
        - parts/10-texture-and-arrangement/48-bass-lines-that-outline-harmony.qmd
        - parts/10-texture-and-arrangement/49-drum-grids.qmd
        - parts/10-texture-and-arrangement/50-register-timbre-space.qmd
        - parts/10-texture-and-arrangement/51-canon-imitation.qmd
    - part: "Part 11. Chromatic harmony"
      chapters:
        - parts/11-chromatic-harmony/52-secondary-dominants.qmd
        - parts/11-chromatic-harmony/53-modulation-state-change.qmd
        - parts/11-chromatic-harmony/54-borrowed-chords-blues.qmd
    - part: "Part 12. Capstones"
      chapters:
        - parts/12-capstones/55-capstone-solo-melody.qmd
        - parts/12-capstones/56-capstone-b-melody-accompaniment.qmd
        - parts/12-capstones/57-capstone-c-two-voice-polyphony.qmd
        - parts/12-capstones/58-refactor-into-your-own-library.qmd
    # END CHAPTERS

  appendices:
    - appendix/ruby-for-non-rubyists.qmd
    - appendix/sonic-pi-cheatsheet.qmd
    - appendix/solutions.qmd
    - appendix/glossary.qmd
    - appendix/sources.qmd

# Lessons carry their own numbers, 1 to 58, and those numbers are referenced
# throughout the text and the syllabus. Quarto's automatic chapter numbering
# would sit on top of them and count the two front chapters as well, turning
# Lesson 1 into "3 1. Hello, sound".
number-sections: false

# Base URL used by filters/audio.lua when printing audio links in the book,
# where an <audio> element is no use.
audio-base-url: "https://gauden.github.io/coding-harmony/assets/audio/"

filters:
  - filters/audio.lua

format:
  html:
    theme:
      - cosmo
      - assets/theme/custom.scss
    code-copy: true
    code-overflow: wrap
    code-link: false
    toc: true
    toc-depth: 2
    link-external-newwindow: true
    fig-align: center
  pdf:
    documentclass: scrbook
    papersize: a4
    geometry:
      - inner=3cm
      - outer=2.5cm
      - top=2.5cm
      - bottom=2.5cm
    include-in-header: assets/theme/book.tex
    keep-tex: true
    colorlinks: true
    toc-depth: 1
  epub:
    toc-depth: 2

knitr: false
jupyter: false

execute:
  enabled: false
