name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      # The chapter list is generated from the syllabus. If someone edited
      # _quarto.yml by hand instead, this fails the build rather than
      # publishing a book whose contents disagree with the curriculum.
      - name: Check chapter list is current
        run: |
          python3 scripts/gen_book.py
          git diff --exit-code _quarto.yml

      # Syntax only. The evaluation pass needs a running Sonic Pi and stays
      # local, so it is not part of the deploy.
      - name: Check code snippets
        run: |
          scripts/extract-code.sh
          scripts/check-code.sh

      - name: Render site
        run: quarto render --to html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
